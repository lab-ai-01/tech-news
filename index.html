<!DOCTYPE html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>[AI-Lab] 近期 keynote・演講・研討會（EE／CS）</title>
<meta name="description" content="資訊電機研討會情報：研討會、演講、keynote，每週更新">
<meta property="og:type" content="website">

<meta property="og:description" content="資訊電機研討會情報：研討會、演講、keynote，每週更新">

<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%231a73e8%22%2F%3E%3Ctext%20x%3D%2232%22%20y%3D%2242%22%20font-size%3D%2228%22%20font-weight%3D%22bold%22%20fill%3D%22%23ffffff%22%20text-anchor%3D%22middle%22%20font-family%3D%22sans-serif%22%3EAI%3C%2Ftext%3E%3C%2Fsvg%3E">
<style>body{font-family:-apple-system,"Microsoft JhengHei","PingFang TC",sans-serif;background:#f6f8fb;margin:0;padding:16px;color:#222}.wrap{max-width:720px;margin:0 auto}.sitehead{background:linear-gradient(135deg,#e8f0fe 0%,#d2e3fc 100%);color:#0f1e3d;border-radius:12px;padding:18px;margin-bottom:12px}.sitehead h2{margin:0;font-size:22px;font-weight:800;letter-spacing:.5px}.sitehead .sub{font-size:12px;opacity:.65;margin-top:6px}.bar{background:#fff;border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}.bar input,.bar select{font-size:14px;padding:8px;margin:4px 4px 4px 0;border:1px solid #ccc;border-radius:8px}.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;border-left:5px solid #1a73e8;box-shadow:0 1px 3px rgba(0,0,0,.06);display:flex;gap:12px;transition:transform .15s ease,box-shadow .15s ease}@media(hover:hover){.card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(15,30,61,.16)}}.txt{flex:1;min-width:0}.thumb{width:120px;flex:none;align-self:flex-start;border-radius:8px;overflow:hidden}.thumb img{width:120px;height:90px;object-fit:cover;display:block}.meta{font-size:12px;color:#1a73e8;font-weight:bold}.t{font-size:17px;font-weight:700;margin:5px 0;line-height:1.45}.d{font-size:13px;color:#444;line-height:1.6}.tag{font-size:11px;font-weight:bold;padding:2px 8px;border-radius:10px;margin-left:6px}.free{background:#e6f4ea;color:#137333}.paid{background:#fef7e0;color:#b06000}.loc{background:#e8f0fe;color:#1a73e8}.dl-urgent{background:#fdecea;color:#c5221f}.dl-soon{background:#fef7e0;color:#b06000}.dl-ok{background:#e8f0fe;color:#1a73e8}.btn{display:inline-block;background:#1a73e8;color:#fff;text-decoration:none;font-size:13px;padding:7px 14px;border-radius:8px;margin-top:8px}.like{font-size:15px;background:none;border:1px solid #dadce0;border-radius:8px;padding:5px 10px;margin-top:8px;margin-left:8px;cursor:pointer;vertical-align:middle}.like.on{border-color:#ea4335}.src{color:#1a73e8;font-size:13px;margin-left:10px;text-decoration:none}#count{font-size:13px;color:#666;padding:4px}#fresh{font-size:12px;color:#888;padding:0 4px 8px}.card.done{background:#f0f8f0;border-left-color:#34a853}.card.expired{background:#f1f3f4;border-left-color:#9aa0a6;color:#5f6368}.badge-done{font-size:11px;font-weight:bold;color:#137333;background:#ceead6;padding:2px 8px;border-radius:10px;margin-left:6px}.badge-new{font-size:11px;font-weight:bold;color:#fff;background:#ea4335;padding:2px 8px;border-radius:10px;margin-left:6px}.sec{font-size:14px;font-weight:bold;color:#5f6368;padding:10px 4px 6px}.card.expired .btn{display:none}</style></head>
<body><div class="wrap">
<h2 style="margin:4px 0 12px;font-size:22px;font-weight:800;">[AI-Lab] 近期 keynote・演講・研討會（EE／CS）</h2>
<div id="fresh"></div>
<div class="bar"><input id="q" placeholder="關鍵字搜尋…" size="16"><select id="loc"></select><select id="fee"><option value="">免費＋付費</option><option value="free">只看免費</option><option value="paid">只看付費</option></select><select id="sort"><option value="date">日期排序</option><option value="new">最新加入</option></select><select id="liked"><option value="">全部</option><option value="1">只看愛心 ♥</option></select><select id="catsel" style="display:none;"></select></div>
<div id="count"></div><div id="list"></div>
<script>
let EV=[];
const PAGE_CONF={"locmode":"default","locopts":["","台北","台南","線上","海外"],"cats":null};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function siteId(){try{return (location.pathname||"/").split("/").filter(Boolean)[0]||"main";}catch(e){return "main";}}
function ph(e){const t=(e.title||"").slice(0,18),d=(e.start||"").slice(0,10);const s='<svg xmlns="http://www.w3.org/2000/svg" width="120" height="90"><rect width="120" height="90" fill="#1a3a6b"/><text x="8" y="36" font-size="11" font-weight="bold" fill="#ffffff" font-family="sans-serif">'+t.replace(/&/g,"&amp;").replace(/</g,"&lt;")+'</text><text x="8" y="58" font-size="10" fill="#9ec1ff" font-family="sans-serif">'+d+'</text><text x="8" y="76" font-size="9" fill="#6b8fc7" font-family="sans-serif">AI-Lab</text></svg>';return "data:image/svg+xml;utf8,"+encodeURIComponent(s);}
function locCat(l){l=l||"";if(/\u7dda\u4e0a|Virtual|virtual/i.test(l))return"\u7dda\u4e0a";if(/\u53f0\u5357|\u6210\u5927|\u5357\u5927|\u6c99\u5d19/i.test(l))return"\u53f0\u5357";if(/\u53f0\u5317|\u65b0\u5317|\u6843\u5712|\u65b0\u7af9|\u53f0\u4e2d|\u9ad8\u96c4|USA|\u7f8e\u570b|Minneapolis/i.test(l))return(/USA|\u7f8e\u570b|Minneapolis/i.test(l)?"\u6d77\u5916":"\u53f0\u5317");return"\u5176\u4ed6";}
function confLocCat(l){l=l||"";if(PAGE_CONF.locmode==="cheap"){if(/\u7dda\u4e0a|Virtual|virtual|\u96fb\u5546|\u5b98\u7db2|APP|\u7dda\u4e0a\u5546\u57ce/i.test(l))return"\u7dda\u4e0a";if(/\u53f0\u5357|\u6210\u5927|\u5357\u5927|\u6c99\u5d19/i.test(l))return"\u9650\u53f0\u5357";return"\u4e0d\u9650\u5730\u5340";}return locCat(l);}
function catOf(e){if(!PAGE_CONF.cats)return "";const hay=((e.title||"")+" "+(e.description||"")+" "+(e.location||""));for(const k of Object.keys(PAGE_CONF.cats)){try{if(new RegExp(PAGE_CONF.cats[k].join("|"),"i").test(hay))return k;}catch(_){}}return "";}
function safeDate(iso){try{const d=new Date(iso);if(isNaN(d.getTime()))return null;return d;}catch(_){return null;}}
function toUtc(iso){const d=safeDate(iso);if(!d)return "";const p=n=>String(n).padStart(2,"0");return d.getUTCFullYear()+p(d.getUTCMonth()+1)+p(d.getUTCDate())+"T"+p(d.getUTCHours())+p(d.getUTCMinutes())+"00Z";}
function fmtDt(e){const st=String(e.start||""),en=String(e.end||st);let a=st.slice(0,16).split("T").join(" ");if(st&&en&&st.slice(0,10)!==en.slice(0,10)){a+=" \u2192 "+en.slice(5,16).split("T").join(" ");}return a||"\u65e5\u671f\u672a\u5b9a";}
function fmtTitle(e){try{const d=safeDate(e.start);if(!d)return String(e.title||"");const wd="\u65e5\u4e00\u4e8c\u4e09\u56db\u4e94\u516d"[d.getDay()];const p=n=>String(n).padStart(2,"0");const loc=String(e.location||"").split(/[\uff0c,\u3001(\uff08]/)[0].slice(0,15);return (d.getMonth()+1)+"/"+d.getDate()+"("+wd+") "+d.getHours()+":"+p(d.getMinutes())+" "+e.title+"@"+loc;}catch(_){return String(e.title||"");}}
function todayStr(){const d=new Date();const p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());}
function dlBadge(e){if(!e.deadline)return "";try{const t=todayStr();if(String(e.deadline)<t)return '<span class="tag" style="background:#f1f3f4;color:#5f6368;">\u5831\u540d\u622a\u6b62'+'</span>';const dd=Math.floor((new Date(e.deadline+"T23:59:59+08:00")-new Date(t+"T00:00:00+08:00"))/86400000);if(dd<=0)return '<span class="badge-new">\u4eca\u5929\u622a\u6b62\uff01'+'</span>';if(dd===1)return '<span class="badge-new">\u660e\u5929\u622a\u6b62'+'</span>';const cls=dd<=3?"dl-urgent":(dd<=7?"dl-soon":"dl-ok");return '<span class="tag '+cls+'">\u5269'+dd+'\u5929'+'</span>';}catch(_){return "";}}
function isExpired(e){const s=String(e.end||e.start||"");return !!(s&&s.slice(0,10)<todayStr());}
function getAdded(){try{return JSON.parse(localStorage.getItem("ailab_added_"+siteId())||"[]");}catch(e){return [];}}
function markAdded(id){try{const a=getAdded();if(a.indexOf(id)<0){a.push(id);localStorage.setItem("ailab_added_"+siteId(),JSON.stringify(a));}render();}catch(e){}}
function getLiked(){try{return JSON.parse(localStorage.getItem("ailab_liked_"+siteId())||"[]");}catch(e){return [];}}
function toggleLike(id){try{let a=getLiked();const i=a.indexOf(id);if(i<0){a.push(id);}else{a.splice(i,1);}localStorage.setItem("ailab_liked_"+siteId(),JSON.stringify(a));render();}catch(e){}}
function fillBar(){try{const lo=document.getElementById("loc");lo.innerHTML=PAGE_CONF.locopts.map(o=>"<option value=\""+esc(o)+"\">"+(o?esc(o):"\u5168\u90e8\u5730\u9ede")+"</option>").join("");const cs=document.getElementById("catsel");if(cs){if(PAGE_CONF.cats){cs.style.display="";cs.innerHTML="<option value=\"\">\u5168\u90e8\u5206\u985e</option>"+Object.keys(PAGE_CONF.cats).map(k=>"<option value=\""+esc(k)+"\">"+esc(k)+"</option>").join("");}else{cs.style.display="none";}}}catch(_){}}
function cardHtml(e){
e=e||{};
var dt=fmtDt(e);
var q2=new URLSearchParams({action:"TEMPLATE",text:fmtTitle(e),dates:toUtc(e.start)+"/"+toUtc(e.end),details:(e.description||"")+(e.url?"\n"+e.url:""),location:e.location||""});
var imgSrc=e.img||ph(e);
var imgHtml='<img loading="lazy" src="'+esc(imgSrc)+'" alt="" onerror="this.onerror=null;this.src=\''+ph(e)+'\'">';
var lk0=getLiked().indexOf(e.id)>=0;
var likeBtn='<button class="like'+(lk0?" on":"")+'" onclick="toggleLike(\''+e.id+'\')" title="\u6709\u8208\u8da3">'+(lk0?"\u2764\ufe0f":"\u2661")+'</button>';
var img='<div class="thumb">'+(e.url?'<a href="'+esc(e.url)+'" target="_blank" rel="noopener">'+imgHtml+'</a>':imgHtml)+'<div style="text-align:right;">'+likeBtn+'</div></div>';
var exp=isExpired(e);var done=getAdded().indexOf(e.id)>=0;
var h='<div class="card'+(exp?" expired":"")+(done&&!exp?" done":"")+'"><div class="txt"><div class="meta">'+dt+'\uff5c'+esc(e.location||"");
h+='<span class="tag '+(e.free?"free":"paid")+'">'+(e.free?"\u514d\u8cbb":"\u4ed8\u8cbb")+'</span><span class="tag loc">'+confLocCat(e.location)+'</span>'+dlBadge(e);
(()=>{const cb=catOf(e);if(cb)h+='<span class="tag loc">'+esc(cb)+'</span>';})();
if(done&&!exp){h+='<span class="badge-done">\u5df2\u52a0\u5165\u2713</span>';}
if(exp){h+='<span class="tag loc">\u5df2\u7d50\u675f</span>';}
h+='</div><div class="t">'+(e.url?'<a style="color:inherit;text-decoration:none;" href="'+esc(e.url)+'" target="_blank" rel="noopener">'+esc(e.title)+'</a>':esc(e.title))+'</div><div class="d">'+esc(e.description||"")+'</div>';
if(!exp){h+='<a class="btn" target="_blank" rel="noopener" href="https://calendar.google.com/calendar/render?'+q2.toString()+'" onclick="markAdded(\''+e.id+'\')">\u52a0\u5165\u884c\u4e8b\u66c6</a>';}
if(e.url){h+='<a class="src" href="'+esc(e.url)+'">\u4f86\u6e90</a>';}
h+='</div>'+img+'</div>';return h;}
function render(){
const q=document.getElementById("q").value.trim(),loc=document.getElementById("loc").value,fee=document.getElementById("fee").value,sort=document.getElementById("sort").value,Olk=document.getElementById("liked").value,catf=(document.getElementById("catsel")?document.getElementById("catsel").value:"");
let r=EV.filter(e=>{e=e||{};if(q&&(((e.title||"")+(e.description||"")+(e.location||"")).indexOf(q)<0))return false;if(loc&&confLocCat(e.location)!==loc)return false;if(fee==="free"&&!e.free)return false;if(fee==="paid"&&e.free)return false;if(catf&&catOf(e)!==catf)return false;if(Olk==="1"&&getLiked().indexOf(e.id)<0)return false;return true;});
r.sort((a,b)=>String(a.start||"").localeCompare(String(b.start||"")));
if(sort==="new")r.sort((a,b)=>String(b.added||"").localeCompare(String(a.added||"")));
document.getElementById("count").textContent="\u5171 "+r.length+" \u5834\uff08\u7e3d\u5eab "+EV.length+" \u5834\uff09";
try{var mx="";for(const e of EV){const a=(e&&e.added)||"";if(a&&a>mx)mx=a;}document.getElementById("fresh").textContent="\u8cc7\u6599\u66f4\u65b0\uff1a"+(mx||"—")+"\uff5c\u5171 "+EV.length+" \u5834";}catch(_){}
var act=r.filter(function(e){return !isExpired(e);});var old=r.filter(function(e){return isExpired(e);});
var h=act.map(cardHtml).join("")||"<p>\u6c92\u6709\u7b26\u5408\u7684\u5834\u6b21\u3002</p>";
if(old.length){h+='<div class="sec">\u5df2\u7d50\u675f\uff08'+old.length+'\u5834\uff09</div>'+old.map(cardHtml).join("");}
document.getElementById("list").innerHTML=h;}
["q","loc","fee","sort","liked","catsel"].forEach(id=>{try{const el=document.getElementById(id);if(el)el.addEventListener("input",render);}catch(_){}});
try{fillBar();}catch(_){}
function loadEv(n){fetch("events.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.json();}).then(j=>{EV=Array.isArray(j)?j:[];render();}).catch(()=>{if(n<4){document.getElementById("list").innerHTML="<p>\u7e3d\u5eab\u66f4\u65b0\u4e2d\uff0c5 \u79d2\u5f8c\u91cd\u8a66\u2026</p>";setTimeout(()=>loadEv(n+1),5000);}else{document.getElementById("list").innerHTML="<p>\u7e3d\u5eab\u8f09\u5165\u5931\u6557\uff0c\u8acb\u7a0d\u5f8c\u518d\u8a66\u3002</p>";}});}
loadEv(0);
try{if(typeof window!=="undefined"&&window.addEventListener){window.addEventListener("pageshow",function(){loadEv(0);});}if(typeof document!=="undefined"&&document.addEventListener){document.addEventListener("visibilitychange",function(){if(!document.hidden)loadEv(0);});}}catch(_){}
</script></div></body></html>
