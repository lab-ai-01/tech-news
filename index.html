<!DOCTYPE html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>[AI-Lab] 近期 keynote・演講・研討會（EE／CS）</title>
<style>body{font-family:-apple-system,"Microsoft JhengHei","PingFang TC",sans-serif;background:#f4f6f8;margin:0;padding:16px;color:#222}.wrap{max-width:720px;margin:0 auto}.bar{background:#fff;border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}.bar input,.bar select{font-size:14px;padding:8px;margin:4px 4px 4px 0;border:1px solid #ccc;border-radius:8px}.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;border-left:5px solid #1a73e8;box-shadow:0 1px 3px rgba(0,0,0,.06);display:flex;gap:12px}.txt{flex:1;min-width:0}.thumb{width:120px;flex:none;align-self:flex-start;border-radius:8px;overflow:hidden}.thumb img{width:120px;height:90px;object-fit:cover;display:block}.meta{font-size:12px;color:#1a73e8;font-weight:bold}.t{font-size:16px;font-weight:bold;margin:4px 0}.d{font-size:13px;color:#444}.tag{font-size:11px;font-weight:bold;padding:2px 8px;border-radius:10px;margin-left:6px}.free{background:#e6f4ea;color:#137333}.paid{background:#fef7e0;color:#b06000}.loc{background:#e8f0fe;color:#1a73e8}.btn{display:inline-block;background:#1a73e8;color:#fff;text-decoration:none;font-size:13px;padding:7px 14px;border-radius:8px;margin-top:8px}.src{color:#1a73e8;font-size:13px;margin-left:10px;text-decoration:none}#count{font-size:13px;color:#666;padding:4px}.card.done{background:#f0f8f0;border-left-color:#34a853;}.card.expired{background:#f1f3f4;border-left-color:#9aa0a6;color:#5f6368;}.badge-done{font-size:11px;font-weight:bold;color:#137333;background:#ceead6;padding:2px 8px;border-radius:10px;margin-left:6px;}.sec{font-size:14px;font-weight:bold;color:#5f6368;padding:10px 4px 6px;}.card.expired .btn{display:none;}</style></head>
<body><div class="wrap">
<h2 style="margin:4px 0 12px;">[AI-Lab] 近期 keynote・演講・研討會（EE／CS）</h2>
<div class="bar"><input id="q" placeholder="關鍵字搜尋…" size="16"><select id="loc"><option value="">全部地點</option><option>台北</option><option>台南</option><option>線上</option><option>海外</option></select><select id="fee"><option value="">免費＋付費</option><option value="free">只看免費</option><option value="paid">只看付費</option></select><select id="sort"><option value="date">日期排序</option><option value="new">最新加入</option></select></div>
<div id="count"></div><div id="list"></div>
<script>
let EV=[];
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function ph(e){const t=(e.title||"").slice(0,18),d=(e.start||"").slice(0,10);const s='<svg xmlns="http://www.w3.org/2000/svg" width="120" height="90"><rect width="120" height="90" fill="#1a3a6b"/><text x="8" y="36" font-size="11" font-weight="bold" fill="#ffffff" font-family="sans-serif">'+t.replace(/&/g,"&amp;").replace(/</g,"&lt;")+'</text><text x="8" y="58" font-size="10" fill="#9ec1ff" font-family="sans-serif">'+d+'</text><text x="8" y="76" font-size="9" fill="#6b8fc7" font-family="sans-serif">AI-Lab</text></svg>';return "data:image/svg+xml;utf8,"+encodeURIComponent(s);}
function todayStr(){const d=new Date();const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
function getAdded(){try{return JSON.parse(localStorage.getItem('ailab_added')||'[]');}catch(e){return [];}}
function markAdded(id){try{const a=getAdded();if(a.indexOf(id)<0){a.push(id);localStorage.setItem('ailab_added',JSON.stringify(a));}render();}catch(e){}}
function isExpired(e){return (e.end||e.start||'').slice(0,10)<todayStr();}
function locCat(l){l=l||"";if(/線上|Virtual|virtual/i.test(l))return"線上";if(/台南|成大|南大|沙崙/i.test(l))return"台南";if(/台北|新北|桃園|新竹|台中|高雄|USA|美國|Minneapolis/i.test(l))return(/USA|美國|Minneapolis/i.test(l)?"海外":"台北");return"其他";}
function render(){const q=document.getElementById("q").value.trim(),loc=document.getElementById("loc").value,fee=document.getElementById("fee").value,sort=document.getElementById("sort").value;
let r=EV.filter(e=>{if(q&&((e.title+e.description+e.location).indexOf(q)<0))return false;if(loc&&locCat(e.location)!==loc)return false;if(fee==="free"&&!e.free)return false;if(fee==="paid"&&e.free)return false;return true;});
r.sort((a,b)=>sort==="date"?a.start.localeCompare(b.start):b.added.localeCompare(a.added));
document.getElementById("count").textContent="共 "+r.length+" 場（總庫 "+EV.length+" 場）";
function cardHtml(e){var dt=e.start.slice(0,16).split('T').join(' ');if(e.start.slice(0,10)!==e.end.slice(0,10)){dt+=' \u2192 '+e.end.slice(5,16).split('T').join(' ');}var q2=new URLSearchParams({action:'TEMPLATE',text:e.title,dates:toUtc(e.start)+'/'+toUtc(e.end),details:(e.description||'')+(e.url?'\n'+e.url:''),location:e.location||''});var imgSrc=e.img||ph(e);var img='<div class="thumb"><img loading="lazy" src="'+esc(imgSrc)+'" alt=""></div>';var exp=isExpired(e);var done=getAdded().indexOf(e.id)>=0;var h='<div class="card'+(exp?' expired':'')+(done&&!exp?' done':'')+'"><div class="txt"><div class="meta">'+dt+'\uff5c'+esc(e.location||'');h+='<span class="tag '+(e.free?'free':'paid')+'">'+(e.free?'\u514d\u8cbb':'\u4ed8\u8cbb')+'</span><span class="tag loc">'+locCat(e.location)+'</span>';if(done&&!exp){h+='<span class="badge-done">\u5df2\u52a0\u5165\u2713</span>';}if(exp){h+='<span class="tag loc">\u5df2\u7d50\u675f</span>';}h+='</div><div class="t">'+esc(e.title)+'</div><div class="d">'+esc(e.description||'')+'</div>';if(!exp){h+='<a class="btn" target="_blank" rel="noopener" href="https://calendar.google.com/calendar/render?'+q2.toString()+'" onclick="markAdded(\''+e.id+'\')">\u52a0\u5165\u884c\u4e8b\u66c6</a>';}if(e.url){h+='<a class="src" href="'+esc(e.url)+'">\u4f86\u6e90</a>';}h+='</div>'+img+'</div>';return h;}var act=r.filter(function(e){return !isExpired(e);});var old=r.filter(function(e){return isExpired(e);});var h=act.map(cardHtml).join('')||'<p>\u6c92\u6709\u7b26\u5408\u7684\u5834\u6b21\u3002</p>';if(old.length){h+='<div class="sec">\u5df2\u7d50\u675f\uff08'+old.length+'\u5834\uff09</div>'+old.map(cardHtml).join('');}document.getElementById("list").innerHTML=h;}
function toUtc(iso){const d=new Date(iso);const p=n=>String(n).padStart(2,"0");return d.getUTCFullYear()+p(d.getUTCMonth()+1)+p(d.getUTCDate())+"T"+p(d.getUTCHours())+p(d.getUTCMinutes())+"00Z";}
["q","loc","fee","sort"].forEach(id=>document.getElementById(id).addEventListener("input",render));
function loadEv(n){fetch("events.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.json();}).then(j=>{EV=j;render();}).catch(()=>{if(n<4){document.getElementById("list").innerHTML="<p>總庫更新中，5 秒後重試…</p>";setTimeout(()=>loadEv(n+1),5000);}else{document.getElementById("list").innerHTML="<p>總庫載入失敗，請稍後再試。</p>";}});}
loadEv(0);
</script></div></body></html>
