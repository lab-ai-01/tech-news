<!DOCTYPE html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>[AI-Lab] 近期 keynote・演講・研討會（EE／CS）</title>
<style>body{font-family:-apple-system,"Microsoft JhengHei","PingFang TC",sans-serif;background:#f4f6f8;margin:0;padding:16px;color:#222}.wrap{max-width:720px;margin:0 auto}.bar{background:#fff;border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}.bar input,.bar select{font-size:14px;padding:8px;margin:4px 4px 4px 0;border:1px solid #ccc;border-radius:8px}.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;border-left:5px solid #1a73e8;box-shadow:0 1px 3px rgba(0,0,0,.06);display:flex;gap:12px}.txt{flex:1;min-width:0}.thumb{width:120px;flex:none;align-self:flex-start;border-radius:8px;overflow:hidden}.thumb img{width:120px;height:90px;object-fit:cover;display:block}.meta{font-size:12px;color:#1a73e8;font-weight:bold}.t{font-size:16px;font-weight:bold;margin:4px 0}.d{font-size:13px;color:#444}.tag{font-size:11px;font-weight:bold;padding:2px 8px;border-radius:10px;margin-left:6px}.free{background:#e6f4ea;color:#137333}.paid{background:#fef7e0;color:#b06000}.loc{background:#e8f0fe;color:#1a73e8}.btn{display:inline-block;background:#1a73e8;color:#fff;text-decoration:none;font-size:13px;padding:7px 14px;border-radius:8px;margin-top:8px}.src{color:#1a73e8;font-size:13px;margin-left:10px;text-decoration:none}#count{font-size:13px;color:#666;padding:4px}</style></head>
<body><div class="wrap">
<h2 style="margin:4px 0 12px;">[AI-Lab] 近期 keynote・演講・研討會（EE／CS）</h2>
<div class="bar"><input id="q" placeholder="關鍵字搜尋…" size="16"><select id="loc"><option value="">全部地點</option><option>台北</option><option>台南</option><option>線上</option><option>海外</option></select><select id="fee"><option value="">免費＋付費</option><option value="free">只看免費</option><option value="paid">只看付費</option></select><select id="sort"><option value="date">日期排序</option><option value="new">最新加入</option></select></div>
<div id="count"></div><div id="list"></div>
<script>
let EV=[];
function locCat(l){l=l||"";if(/線上|Virtual|virtual/i.test(l))return"線上";if(/台南|成大|南大|沙崙/i.test(l))return"台南";if(/台北|新北|桃園|新竹|台中|高雄|USA|美國|Minneapolis/i.test(l))return(/USA|美國|Minneapolis/i.test(l)?"海外":"台北");return"其他";}
function render(){const q=document.getElementById("q").value.trim(),loc=document.getElementById("loc").value,fee=document.getElementById("fee").value,sort=document.getElementById("sort").value;
let r=EV.filter(e=>{if(q&&((e.title+e.description+e.location).indexOf(q)<0))return false;if(loc&&locCat(e.location)!==loc)return false;if(fee==="free"&&!e.free)return false;if(fee==="paid"&&e.free)return false;return true;});
r.sort((a,b)=>sort==="date"?a.start.localeCompare(b.start):b.added.localeCompare(a.added));
document.getElementById("count").textContent="共 "+r.length+" 場（總庫 "+EV.length+" 場）";
document.getElementById("list").innerHTML=r.map(e=>{const dt=e.start.slice(0,16).replace("T"," ")+(e.start.slice(0,10)!==e.end.slice(0,10)?" → "+e.end.slice(5,16).replace("T"," "):"");
const q2=new URLSearchParams({action:"TEMPLATE",text:e.title,dates:toUtc(e.start)+"/"+toUtc(e.end),details:(e.description||"")+(e.url?"\n"+e.url:""),location:e.location||""});
const img=e.img?'<div class="thumb"><img loading="lazy" src="'+esc(e.img)+'" alt="" onerror="this.parentNode.style.display=\'none\'"></div>':"";
return '<div class="card"><div class="txt"><div class="meta">'+dt+'｜'+esc(e.location||"")+'<span class="tag '+(e.free?"free":"paid")+'">'+(e.free?"免費":"付費")+'</span><span class="tag loc">'+locCat(e.location)+'</span></div><div class="t">'+esc(e.title)+'</div><div class="d">'+esc(e.description||"")+'</div><a class="btn" href="https://calendar.google.com/calendar/render?'+q2.toString()+'">加入行事曆</a>'+(e.url?'<a class="src" href="'+esc(e.url)+'">來源</a>':"")+'</div>'+img+'</div>';}).join("")||"<p>沒有符合的場次。</p>";}
function toUtc(iso){const d=new Date(iso);const p=n=>String(n).padStart(2,"0");return d.getUTCFullYear()+p(d.getUTCMonth()+1)+p(d.getUTCDate())+"T"+p(d.getUTCHours())+p(d.getUTCMinutes())+"00Z";}
["q","loc","fee","sort"].forEach(id=>document.getElementById(id).addEventListener("input",render));
fetch("events.json").then(r=>r.json()).then(j=>{EV=j;render();}).catch(()=>{document.getElementById("list").innerHTML="<p>events.json 載入失敗。</p>";});
</script></div></body></html>
